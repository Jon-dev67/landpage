<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDentim</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: white;
            color: #333;
            text-align: center;
        }
        
        .header {
            background-color: #1e7d4e; /* Verde mais escuro */
            padding: 40px 20px;
            color: white;
        }
        
        .product-name {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .product-section {
            padding: 60px 20px;
        }
        
        .product-image {
            max-width: 300px;
            width: 100%;
            margin-bottom: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .btn {
            display: inline-block;
            background-color: #1e7d4e; /* Verde mais escuro */
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(30, 125, 78, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }
        
        .btn:hover {
            background-color: #16633f;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(30, 125, 78, 0.4);
        }
        
        .certifications {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .footer {
            background-color: #1e7d4e; /* Verde mais escuro */
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="product-name">ProDentim</h1>
    </div>
    
    <div class="product-section">
        <img src="prodentim.jpg" alt="ProDentim" class="product-image">
        <br>
        <a href="https://prodentim24.com/text.php#aff=jonathan2026" class="btn">Official Website Click Here</a>
        <br>
        <img src="certifications.png" alt="Certificações ProDentim" class="certifications">
    </div>
    
    <div class="footer"></div>
</body>
</html>
